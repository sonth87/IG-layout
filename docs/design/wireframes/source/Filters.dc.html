<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
a{color:var(--accent-text)}
.theme-dark{--bg:#111214;--canvas:#0B0B0C;--surface:#1C1D21;--surface2:#26282D;--border:#2E3036;--border2:#3A3C42;--divider:#1F2024;--text:#F2F2F0;--text2:#C4C6CC;--muted:#A3A6AD;--disabled:#55585F;--accent-text:#F2B84B;--accent-soft:#2A2312;--accent-soft-border:#5A4618;--accent-soft-text:#F5E6C4;--info-bg:#142430;--info-border:#23445A;--info-text:#CFE6F5;--info-strong:#7CC4F2;--story-bg:#2A1730;--story-text:#E59BF0;--danger:#F28B82;--ig-bg:#000000;--dash:#4A4D55}
.theme-light{--bg:#F6F5F2;--canvas:#E6E3DD;--surface:#FFFFFF;--surface2:#EFEDE8;--border:#DAD7D0;--border2:#C9C5BC;--divider:#E4E1DA;--text:#1A1B1E;--text2:#3D4047;--muted:#5F636B;--disabled:#B5B8BE;--accent-text:#8A5A00;--accent-soft:#FCEFD2;--accent-soft-border:#EED9A6;--accent-soft-text:#5C4310;--info-bg:#E3F1FA;--info-border:#B9DCF0;--info-text:#1F4F70;--info-strong:#0F5C8A;--story-bg:#F6E6F8;--story-text:#8A2E99;--danger:#C0392B;--ig-bg:#FFFFFF;--dash:#B8B3A9}
button{font-family:inherit}
</style>
</helmet>
<div class="theme-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: relative; flex: 1; background: var(--canvas); display: flex; align-items: center; justify-content: center">
    <div style="width: 250px; height: 312px; background: linear-gradient(160deg, #8A6A4A, #D8C49A); box-shadow: 0 10px 24px rgba(0,0,0,0.5)"></div>
    <button style="position: absolute; right: 16px; top: 16px; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; display: flex; align-items: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      Hold to compare
    </button>
  </div>

  <section aria-label="Filters" style="background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 8px 0 24px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <button aria-label="Cancel" style="width: 48px; height: 48px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div style="font-size: 15px; font-weight: 700">Filters</div>
      <a href="ApplyAll.dc.html" aria-label="Apply" style="width: 48px; height: 48px; border-radius: 24px; background: #F2B84B; color: #1A1408; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      </a>
    </div>

    <div role="tablist" aria-label="Filter groups" style="display: flex; gap: 20px; padding: 8px 20px 0; border-bottom: 1px solid var(--border)">
      <button role="tab" aria-selected="false" style="height: 40px; border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 0">Mono</button>
      <button role="tab" aria-selected="true" style="height: 40px; border: none; border-bottom: 2px solid #F2B84B; background: transparent; color: var(--text); font-size: 14px; font-weight: 700; padding: 0">Vintage</button>
      <button role="tab" aria-selected="false" style="height: 40px; border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 0">Modern</button>
      <button role="tab" aria-selected="false" style="height: 40px; border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 0">Future</button>
    </div>

    <div style="display: flex; gap: 10px; padding: 14px 16px 0; overflow: hidden">
      <button style="width: 68px; flex-shrink: 0; border: none; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; padding: 0">
        <span style="width: 64px; height: 64px; border-radius: 10px; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></span>None
      </button>
      <button aria-pressed="true" style="width: 68px; flex-shrink: 0; border: none; background: transparent; color: var(--accent-text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 0">
        <span style="width: 64px; height: 64px; border-radius: 10px; border: 2px solid #F2B84B; box-sizing: border-box; background: linear-gradient(160deg, #8A6A4A, #D8C49A)"></span>Kyoto
      </button>
      <button style="width: 68px; flex-shrink: 0; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; padding: 0">
        <span style="width: 64px; height: 64px; border-radius: 10px; background: linear-gradient(160deg, #6F7A6A, #C9C2A8)"></span>Tokyo 90
      </button>
      <button style="width: 68px; flex-shrink: 0; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; padding: 0">
        <span style="width: 64px; height: 64px; border-radius: 10px; background: linear-gradient(160deg, #B0602F, #F2C27A)"></span>Retro 70
      </button>
      <button style="width: 68px; flex-shrink: 0; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; padding: 0">
        <span style="width: 64px; height: 64px; border-radius: 10px; background: linear-gradient(160deg, #5E7A80, #D9CDB8)"></span>Instant
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 18px 20px 4px">
      <span style="font-size: 13px; color: var(--muted); width: 60px">Intensity</span>
      <div style="position: relative; flex: 1; height: 28px">
        <div style="position: absolute; left: 0; right: 0; top: 13px; height: 3px; border-radius: 2px; background: var(--border2)"></div>
        <div style="position: absolute; left: 0; top: 13px; width: 80%; height: 3px; border-radius: 2px; background: #F2B84B"></div>
        <div style="position: absolute; left: 80%; top: 3px; width: 22px; height: 22px; margin-left: -11px; border-radius: 11px; background: var(--text)"></div>
      </div>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 14px; width: 30px; text-align: right">80</span>
    </div>

    <label style="display: flex; align-items: center; gap: 12px; margin: 12px 16px 0; padding: 12px 14px; border-radius: 14px; background: var(--surface2); font-size: 14px">
      <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: var(--accent-text); margin: 0">
      <span style="flex: 1">Apply to all photos <span style="color: var(--muted)">(5)</span></span>
      <span style="font-size: 12px; color: var(--muted)">filter only</span>
    </label>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
