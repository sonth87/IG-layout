<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grid project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
a{color:var(--accent-text)}
.theme-dark{--bg:#111214;--canvas:#0B0B0C;--surface:#1C1D21;--surface2:#26282D;--border:#2E3036;--border2:#3A3C42;--divider:#1F2024;--text:#F2F2F0;--text2:#C4C6CC;--muted:#A3A6AD;--disabled:#55585F;--accent-text:#F2B84B;--accent-soft:#2A2312;--accent-soft-border:#5A4618;--accent-soft-text:#F5E6C4;--info-bg:#142430;--info-border:#23445A;--info-text:#CFE6F5;--info-strong:#7CC4F2;--story-bg:#2A1730;--story-text:#E59BF0;--danger:#F28B82;--ig-bg:#000000;--dash:#4A4D55}
.theme-light{--bg:#F6F5F2;--canvas:#E6E3DD;--surface:#FFFFFF;--surface2:#EFEDE8;--border:#DAD7D0;--border2:#C9C5BC;--divider:#E4E1DA;--text:#1A1B1E;--text2:#3D4047;--muted:#5F636B;--disabled:#B5B8BE;--accent-text:#8A5A00;--accent-soft:#FCEFD2;--accent-soft-border:#EED9A6;--accent-soft-text:#5C4310;--info-bg:#E3F1FA;--info-border:#B9DCF0;--info-text:#1F4F70;--info-strong:#0F5C8A;--story-bg:#F6E6F8;--story-text:#8A2E99;--danger:#C0392B;--ig-bg:#FFFFFF;--dash:#B8B3A9}
button{font-family:inherit}
</style>
</helmet>
<div class="theme-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 2px; padding: 10px 8px 6px">
    <button aria-label="Back to projects" style="width: 44px; height: 44px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600">Summer grid</div>
    <button aria-label="Undo" style="width: 44px; height: 44px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
    </button>
    <button aria-label="Redo" style="width: 44px; height: 44px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
    </button>
    <button style="height: 38px; padding: 0 14px; margin-left: 4px; border-radius: 12px; border: none; background: #F2B84B; color: #1A1408; font-weight: 700; font-size: 14px">Export</button>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 20px 0; background: var(--canvas)">
    <div style="display: flex; justify-content: space-between; width: 330px; font-size: 12px; color: var(--muted)">
      <span>3 × 3 · 9 posts · each 1080 × 1440</span>
      <span>Numbers = posting order</span>
    </div>
    <div style="position: relative; width: 330px; height: 440px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; background: var(--canvas)">
      <div style="position: absolute; inset: 0; background: linear-gradient(150deg, #F0B58A 0%, #D9728A 35%, #8A4F9A 65%, #2E3266 100%)"></div>
      <div style="position: relative; border-right: 3px solid var(--canvas); border-bottom: 3px solid var(--canvas); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(17,18,20,0.8); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">9</span></div>
      <div style="position: relative; border-right: 3px solid var(--canvas); border-bottom: 3px solid var(--canvas); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(17,18,20,0.8); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">8</span></div>
      <div style="position: relative; border-bottom: 3px solid var(--canvas); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(17,18,20,0.8); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">7</span></div>
      <div style="position: relative; border-right: 3px solid var(--canvas); border-bottom: 3px solid var(--canvas); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(17,18,20,0.8); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">6</span></div>
      <div style="position: relative; border-right: 3px solid var(--canvas); border-bottom: 3px solid var(--canvas); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(17,18,20,0.8); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">5</span></div>
      <div style="position: relative; border-bottom: 3px solid var(--canvas); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(17,18,20,0.8); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">4</span></div>
      <div style="position: relative; border-right: 3px solid var(--canvas); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(17,18,20,0.8); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span></div>
      <div style="position: relative; border-right: 3px solid var(--canvas); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(17,18,20,0.8); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span></div>
      <div style="position: relative; display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: #F2B84B; color: #1A1408; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span></div>
      <div style="position: absolute; left: 24px; top: 168px; font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; color: #FFFFFF; letter-spacing: 4px">SUMMER</div>
    </div>
    <p style="margin: 0; width: 330px; font-size: 12px; color: var(--muted); line-height: 1.5">Post tile 1 first. Instagram shows the newest post top-left, so the picture assembles correctly.</p>
  </div>

  <section aria-label="Grid options" style="background: var(--surface); border-top-left-radius: 18px; border-top-right-radius: 18px; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 14px">Rows</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Fewer rows" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 20px">−</button>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">3</span>
        <button aria-label="More rows" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 20px">+</button>
      </div>
    </div>
    <label style="display: flex; align-items: center; justify-content: space-between; font-size: 14px">
      <span>Compensate profile gaps</span>
      <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: var(--accent-text); margin: 0">
    </label>
  </section>

  <nav aria-label="Tools" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px 4px 22px; background: var(--surface); border-top: 1px solid var(--surface2)">
    <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>Photos</button>
    <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
    <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="4"/><rect x="13" y="13" width="8" height="8" rx="1"/><path d="M4 21l4-6 4 6z"/></svg>Elements</button>
    <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/></svg>Filters</button>
    <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l6-6 12 12"/></svg>Background</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
