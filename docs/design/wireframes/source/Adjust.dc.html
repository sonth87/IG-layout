<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adjust</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
a{color:var(--accent-text)}
.theme-dark{--bg:#111214;--canvas:#0B0B0C;--surface:#1C1D21;--surface2:#26282D;--border:#2E3036;--border2:#3A3C42;--divider:#1F2024;--text:#F2F2F0;--text2:#C4C6CC;--muted:#A3A6AD;--disabled:#55585F;--accent-text:#F2B84B;--accent-soft:#2A2312;--accent-soft-border:#5A4618;--accent-soft-text:#F5E6C4;--info-bg:#142430;--info-border:#23445A;--info-text:#CFE6F5;--info-strong:#7CC4F2;--story-bg:#2A1730;--story-text:#E59BF0;--danger:#F28B82;--ig-bg:#000000;--dash:#4A4D55}
.theme-light{--bg:#F6F5F2;--canvas:#E6E3DD;--surface:#FFFFFF;--surface2:#EFEDE8;--border:#DAD7D0;--border2:#C9C5BC;--divider:#E4E1DA;--text:#1A1B1E;--text2:#3D4047;--muted:#5F636B;--disabled:#B5B8BE;--accent-text:#8A5A00;--accent-soft:#FCEFD2;--accent-soft-border:#EED9A6;--accent-soft-text:#5C4310;--info-bg:#E3F1FA;--info-border:#B9DCF0;--info-text:#1F4F70;--info-strong:#0F5C8A;--story-bg:#F6E6F8;--story-text:#8A2E99;--danger:#C0392B;--ig-bg:#FFFFFF;--dash:#B8B3A9}
button{font-family:inherit}
</style>
</helmet>
<div class="theme-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: relative; flex: 1; background: var(--canvas); display: flex; align-items: center; justify-content: center">
    <div style="width: 260px; height: 326px; background: linear-gradient(160deg, #9E4F5C, #E8B08E); box-shadow: 0 10px 24px rgba(0,0,0,0.5)"></div>
    <button style="position: absolute; right: 16px; top: 16px; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; display: flex; align-items: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      Hold to compare
    </button>
  </div>

  <section aria-label="Adjust" style="background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 8px 0 26px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <button aria-label="Cancel" style="width: 48px; height: 48px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div style="text-align: center">
        <div style="font-size: 15px; font-weight: 700">Hue</div>
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--accent-text)">+12</div>
      </div>
      <button aria-label="Apply" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: #F2B84B; color: #1A1408; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>

    <div style="padding: 18px 28px 6px">
      <label for="hue" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Hue</label>
      <div style="position: relative; height: 28px">
        <div style="position: absolute; left: 0; right: 0; top: 13px; height: 3px; border-radius: 2px; background: var(--border2)"></div>
        <div style="position: absolute; left: 50%; top: 13px; width: 6%; height: 3px; background: #F2B84B"></div>
        <div style="position: absolute; left: 50%; top: 6px; width: 2px; height: 17px; margin-left: -1px; background: var(--muted)"></div>
        <div style="position: absolute; left: 56%; top: 3px; width: 22px; height: 22px; margin-left: -11px; border-radius: 11px; background: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.4)"></div>
        <input id="hue" type="range" min="-100" max="100" value="12" style="position: absolute; inset: 0; width: 100%; opacity: 0">
      </div>
      <p style="margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted)">Double-tap the slider to reset</p>
    </div>

    <div role="tablist" aria-label="Adjustments" style="display: flex; gap: 14px; padding: 14px 16px 0; overflow: hidden">
      <button role="tab" aria-selected="false" style="width: 60px; flex-shrink: 0; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; padding: 0">
        <span style="position: relative; width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span style="position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 4px; background: #F2B84B"></span></span>Exposure
      </button>
      <button role="tab" aria-selected="false" style="width: 60px; flex-shrink: 0; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; padding: 0">
        <span style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></span>Contrast
      </button>
      <button role="tab" aria-selected="false" style="width: 60px; flex-shrink: 0; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; padding: 0">
        <span style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l3 6 6 .9-4.5 4.3 1 6.3L12 17.5 6.5 20.5l1-6.3L3 9.9 9 9z"/></svg></span>Saturation
      </button>
      <button role="tab" aria-selected="true" style="width: 60px; flex-shrink: 0; border: none; background: transparent; color: var(--accent-text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 0">
        <span style="position: relative; width: 48px; height: 48px; border-radius: 24px; border: 2px solid #F2B84B; background: var(--accent-soft); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg><span style="position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 4px; background: #F2B84B"></span></span>Hue
      </button>
      <button role="tab" aria-selected="false" style="width: 60px; flex-shrink: 0; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; padding: 0">
        <span style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg></span>Temp
      </button>
      <button role="tab" aria-selected="false" style="width: 60px; flex-shrink: 0; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; padding: 0">
        <span style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5" stroke-dasharray="2 2"/></svg></span>Vignette
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
