<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor — photo selected (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
a{color:var(--accent-text)}
.theme-dark{--bg:#111214;--canvas:#0B0B0C;--surface:#1C1D21;--surface2:#26282D;--border:#2E3036;--border2:#3A3C42;--divider:#1F2024;--text:#F2F2F0;--text2:#C4C6CC;--muted:#A3A6AD;--disabled:#55585F;--accent-text:#F2B84B;--accent-soft:#2A2312;--accent-soft-border:#5A4618;--accent-soft-text:#F5E6C4;--info-bg:#142430;--info-border:#23445A;--info-text:#CFE6F5;--info-strong:#7CC4F2;--story-bg:#2A1730;--story-text:#E59BF0;--danger:#F28B82;--ig-bg:#000000;--dash:#4A4D55}
.theme-light{--bg:#F6F5F2;--canvas:#E6E3DD;--surface:#FFFFFF;--surface2:#EFEDE8;--border:#DAD7D0;--border2:#C9C5BC;--divider:#E4E1DA;--text:#1A1B1E;--text2:#3D4047;--muted:#5F636B;--disabled:#B5B8BE;--accent-text:#8A5A00;--accent-soft:#FCEFD2;--accent-soft-border:#EED9A6;--accent-soft-text:#5C4310;--info-bg:#E3F1FA;--info-border:#B9DCF0;--info-text:#1F4F70;--info-strong:#0F5C8A;--story-bg:#F6E6F8;--story-text:#8A2E99;--danger:#C0392B;--ig-bg:#FFFFFF;--dash:#B8B3A9}
button{font-family:inherit}
</style>
</helmet>
<div class="theme-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 2px; padding: 10px 8px 6px">
    <a href="Main.dc.html" aria-label="Back to projects" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Da Lat trip</div>
    <button aria-label="Undo" style="width: 44px; height: 44px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
    </button>
    <button aria-label="Redo" disabled style="width: 44px; height: 44px; border: none; background: transparent; color: var(--disabled); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
    </button>
    <a href="Export.dc.html" style="height: 38px; padding: 0 14px; margin-left: 4px; border-radius: 12px; background: #F2B84B; color: #1A1408; font-weight: 700; font-size: 14px; display: flex; align-items: center; text-decoration: none">Export</a>
  </header>

  <div style="position: relative; flex: 1; background: var(--canvas); overflow: hidden">
    <div style="position: absolute; left: 20px; top: 22px; font-size: 12px; color: var(--muted)">Slide 1 / 5</div>
    <div style="position: absolute; left: 304px; top: 22px; font-size: 12px; color: var(--muted)">2</div>

    <div style="position: absolute; left: 20px; top: 44px; width: 1400px; height: 350px; background: linear-gradient(180deg, #6E8FB3 0%, #9CB1C4 30%, #C9A27A 58%, #6E7A4C 80%, #4A5634 100%)">
      <div style="position: absolute; left: 280px; top: 0; bottom: 0; border-left: 1.5px dashed var(--text); opacity: 0.85"></div>
      <div style="position: absolute; left: 560px; top: 0; bottom: 0; border-left: 1.5px dashed var(--text); opacity: 0.85"></div>

      <div style="position: absolute; left: 26px; top: 34px; width: 112px; height: 138px; background: #FFFFFF; padding: 6px 6px 22px; box-sizing: border-box; transform: rotate(-6deg); box-shadow: 0 6px 14px rgba(0,0,0,0.35)">
        <div style="width: 100%; height: 100%; background: linear-gradient(160deg, #3E5B4A, #9DBF8E)"></div>
      </div>

      <div style="position: absolute; left: 196px; top: 96px; width: 140px; height: 176px; background: linear-gradient(160deg, #A9574A, #F0C08A); box-shadow: 0 8px 18px rgba(0,0,0,0.4)"></div>
      <div style="position: absolute; left: 190px; top: 90px; width: 152px; height: 188px; border: 2px solid #F2B84B; box-sizing: border-box"></div>
      <div style="position: absolute; left: 184px; top: 84px; width: 12px; height: 12px; border-radius: 6px; background: var(--text); border: 2px solid #F2B84B"></div>
      <div style="position: absolute; left: 336px; top: 84px; width: 12px; height: 12px; border-radius: 6px; background: var(--text); border: 2px solid #F2B84B"></div>
      <div style="position: absolute; left: 184px; top: 272px; width: 12px; height: 12px; border-radius: 6px; background: var(--text); border: 2px solid #F2B84B"></div>
      <div style="position: absolute; left: 336px; top: 272px; width: 12px; height: 12px; border-radius: 6px; background: var(--text); border: 2px solid #F2B84B"></div>
      <div style="position: absolute; left: 265px; top: 60px; width: 1px; height: 30px; background: #F2B84B"></div>
      <div style="position: absolute; left: 257px; top: 46px; width: 16px; height: 16px; border-radius: 8px; background: #F2B84B"></div>

      <div style="position: absolute; left: 24px; top: 284px; font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: #FFFFFF; letter-spacing: 6px">DA LAT</div>
    </div>

    <div style="position: absolute; left: 116px; top: 404px; display: flex; gap: 2px; padding: 4px; border-radius: 14px; background: var(--surface2); box-shadow: 0 6px 16px rgba(0,0,0,0.4)">
      <button aria-label="Duplicate" style="width: 44px; height: 40px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      </button>
      <button aria-label="Layer order" style="width: 44px; height: 40px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      </button>
      <button aria-label="Flip" style="width: 44px; height: 40px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7L3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg>
      </button>
      <button aria-label="Delete" style="width: 44px; height: 40px; border: none; background: transparent; color: var(--danger); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
    </div>
  </div>

  <nav aria-label="Slides" style="display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--divider)">
    <button aria-label="Slide 1" style="width: 40px; height: 50px; border-radius: 6px; border: 2px solid #F2B84B; background: linear-gradient(180deg, #6E8FB3, #C9A27A 60%, #5A6B44); padding: 0"></button>
    <button aria-label="Slide 2" style="width: 40px; height: 50px; border-radius: 6px; border: 1px solid var(--border); background: linear-gradient(180deg, #6E8FB3, #C9A27A 60%, #5A6B44); padding: 0; opacity: 0.8"></button>
    <button aria-label="Slide 3" style="width: 40px; height: 50px; border-radius: 6px; border: 1px solid var(--border); background: linear-gradient(180deg, #7A98B8, #D1AE86 60%, #5A6B44); padding: 0; opacity: 0.8"></button>
    <button aria-label="Slide 4" style="width: 40px; height: 50px; border-radius: 6px; border: 1px solid var(--border); background: linear-gradient(180deg, #7A98B8, #D1AE86 60%, #4A5634); padding: 0; opacity: 0.8"></button>
    <button aria-label="Slide 5" style="width: 40px; height: 50px; border-radius: 6px; border: 1px solid var(--border); background: linear-gradient(180deg, #6E8FB3, #C9A27A 60%, #4A5634); padding: 0; opacity: 0.8"></button>
    <button aria-label="Add slide" style="width: 40px; height: 50px; border-radius: 6px; border: 1px dashed var(--dash); background: transparent; color: var(--muted); font-size: 20px">+</button>
  </nav>

  <section aria-label="Photo tools" style="padding: 8px 8px 26px; background: var(--surface); border-top-left-radius: 18px; border-top-right-radius: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 10px 6px">
      <span style="font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px">Photo</span>
      <button style="height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 13px; font-weight: 600">Done</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px">
      <button style="height: 64px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>Replace
      </button>
      <button style="height: 64px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>Crop
      </button>
      <a href="Adjust.dc.html" style="height: 64px; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Adjust
      </a>
      <a href="Filters.dc.html" style="height: 64px; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/></svg>Filters
      </a>
      <button style="height: 64px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="5"/></svg>Mask
      </button>
      <button style="height: 64px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="10" height="10"/></svg>Border
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
