<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crop and rotate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
a{color:var(--accent-text)}
.theme-dark{--bg:#111214;--canvas:#0B0B0C;--surface:#1C1D21;--surface2:#26282D;--border:#2E3036;--border2:#3A3C42;--divider:#1F2024;--text:#F2F2F0;--text2:#C4C6CC;--muted:#A3A6AD;--disabled:#55585F;--accent-text:#F2B84B;--accent-soft:#2A2312;--accent-soft-border:#5A4618;--accent-soft-text:#F5E6C4;--info-bg:#142430;--info-border:#23445A;--info-text:#CFE6F5;--info-strong:#7CC4F2;--story-bg:#2A1730;--story-text:#E59BF0;--danger:#F28B82;--ig-bg:#000000;--dash:#4A4D55}
.theme-light{--bg:#F6F5F2;--canvas:#E6E3DD;--surface:#FFFFFF;--surface2:#EFEDE8;--border:#DAD7D0;--border2:#C9C5BC;--divider:#E4E1DA;--text:#1A1B1E;--text2:#3D4047;--muted:#5F636B;--disabled:#B5B8BE;--accent-text:#8A5A00;--accent-soft:#FCEFD2;--accent-soft-border:#EED9A6;--accent-soft-text:#5C4310;--info-bg:#E3F1FA;--info-border:#B9DCF0;--info-text:#1F4F70;--info-strong:#0F5C8A;--story-bg:#F6E6F8;--story-text:#8A2E99;--danger:#C0392B;--ig-bg:#FFFFFF;--dash:#B8B3A9}
button{font-family:inherit}
</style>
</helmet>
<div class="theme-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: relative; flex: 1; background: #0B0B0C; overflow: hidden">
    <div style="position: absolute; left: 20px; top: 50px; width: 350px; height: 262px; background: linear-gradient(160deg, #A9574A, #F0C08A 55%, #6E7A4C); transform: rotate(2.5deg)"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 66px; background: rgba(0,0,0,0.6)"></div>
    <div style="position: absolute; left: 0; right: 0; top: 296px; bottom: 0; background: rgba(0,0,0,0.6)"></div>
    <div style="position: absolute; left: 0; width: 103px; top: 66px; height: 230px; background: rgba(0,0,0,0.6)"></div>
    <div style="position: absolute; right: 103px; width: 0; top: 66px; height: 230px"></div>
    <div style="position: absolute; left: 287px; right: 0; top: 66px; height: 230px; background: rgba(0,0,0,0.6)"></div>

    <div style="position: absolute; left: 103px; top: 66px; width: 184px; height: 230px; border: 1.5px solid #FFFFFF; box-sizing: border-box">
      <div style="position: absolute; left: 33.3%; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,0.45)"></div>
      <div style="position: absolute; left: 66.6%; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,0.45)"></div>
      <div style="position: absolute; top: 33.3%; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,0.45)"></div>
      <div style="position: absolute; top: 66.6%; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,0.45)"></div>
      <div style="position: absolute; left: -4px; top: -4px; width: 20px; height: 20px; border-left: 4px solid #FFFFFF; border-top: 4px solid #FFFFFF"></div>
      <div style="position: absolute; right: -4px; top: -4px; width: 20px; height: 20px; border-right: 4px solid #FFFFFF; border-top: 4px solid #FFFFFF"></div>
      <div style="position: absolute; left: -4px; bottom: -4px; width: 20px; height: 20px; border-left: 4px solid #FFFFFF; border-bottom: 4px solid #FFFFFF"></div>
      <div style="position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-right: 4px solid #FFFFFF; border-bottom: 4px solid #FFFFFF"></div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 12px; color: #C4C6CC">Pinch to zoom · drag to move the photo</div>
  </div>

  <section aria-label="Crop" style="background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 8px 0 24px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <button aria-label="Cancel" style="width: 48px; height: 48px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div style="font-size: 15px; font-weight: 700">Crop</div>
      <button aria-label="Apply" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: #F2B84B; color: #1A1408; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>

    <div style="padding: 10px 20px 0">
      <div style="text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: var(--accent-text)">2.5°</div>
      <div aria-label="Straighten" style="position: relative; height: 34px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center">
        <span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 18px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 18px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 18px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 18px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span><span style="width: 1px; height: 10px; background: var(--muted)"></span>
        <span style="position: absolute; left: 50%; top: 0; width: 2px; height: 34px; margin-left: -1px; background: #F2B84B"></span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; padding: 14px 16px 0; overflow: hidden">
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 13px; white-space: nowrap">Free</button>
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 13px; white-space: nowrap">Original</button>
      <button aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 700; white-space: nowrap">Slot 4:5</button>
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 13px; white-space: nowrap">1:1</button>
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 13px; white-space: nowrap">3:4</button>
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 13px; white-space: nowrap">16:9</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px 8px 0">
      <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Rotate 90°</button>
      <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7L3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg>Flip H</button>
      <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18"/><path d="M7 8l5-5 5 5H7zM7 16l5 5 5-5H7z"/></svg>Flip V</button>
      <button style="height: 60px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6"/><path d="M20 20a8 8 0 0 0-14.9-10"/></svg>Reset</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
