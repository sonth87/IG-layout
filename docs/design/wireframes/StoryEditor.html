<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story project</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
a{color:var(--accent-text)}
.theme-dark{--bg:#111214;--canvas:#0B0B0C;--surface:#1C1D21;--surface2:#26282D;--border:#2E3036;--border2:#3A3C42;--divider:#1F2024;--text:#F2F2F0;--text2:#C4C6CC;--muted:#A3A6AD;--disabled:#55585F;--accent-text:#F2B84B;--accent-soft:#2A2312;--accent-soft-border:#5A4618;--accent-soft-text:#F5E6C4;--info-bg:#142430;--info-border:#23445A;--info-text:#CFE6F5;--info-strong:#7CC4F2;--story-bg:#2A1730;--story-text:#E59BF0;--danger:#F28B82;--ig-bg:#000000;--dash:#4A4D55}
.theme-light{--bg:#F6F5F2;--canvas:#E6E3DD;--surface:#FFFFFF;--surface2:#EFEDE8;--border:#DAD7D0;--border2:#C9C5BC;--divider:#E4E1DA;--text:#1A1B1E;--text2:#3D4047;--muted:#5F636B;--disabled:#B5B8BE;--accent-text:#8A5A00;--accent-soft:#FCEFD2;--accent-soft-border:#EED9A6;--accent-soft-text:#5C4310;--info-bg:#E3F1FA;--info-border:#B9DCF0;--info-text:#1F4F70;--info-strong:#0F5C8A;--story-bg:#F6E6F8;--story-text:#8A2E99;--danger:#C0392B;--ig-bg:#FFFFFF;--dash:#B8B3A9}
button{font-family:inherit}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="theme-dark" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 2px; padding: 10px 8px 6px">
    <button aria-label="Back to projects" style="width: 44px; height: 44px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600">Birthday story</div>
    <button aria-label="Undo" style="width: 44px; height: 44px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
    </button>
    <button aria-label="Redo" disabled style="width: 44px; height: 44px; border: none; background: transparent; color: var(--disabled); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
    </button>
    <button style="height: 38px; padding: 0 14px; margin-left: 4px; border-radius: 12px; border: none; background: #F2B84B; color: #1A1408; font-weight: 700; font-size: 14px">Export</button>
  </header>

  <div style="flex: 1; display: flex; justify-content: center; align-items: center; background: var(--canvas)">
    <div style="position: relative; width: 290px; height: 516px; overflow: hidden; background: linear-gradient(180deg, #2F3B52 0%, #6B5B8E 50%, #E3B48C 100%)">
      <div style="position: absolute; left: 34px; top: 112px; width: 150px; height: 190px; background: #FFFFFF; padding: 7px 7px 26px; box-sizing: border-box; transform: rotate(-5deg)"><div style="width: 100%; height: 100%; background: linear-gradient(160deg, #B0602F, #F2C27A)"></div></div>
      <div style="position: absolute; left: 120px; top: 200px; width: 140px; height: 176px; background: #FFFFFF; padding: 7px 7px 24px; box-sizing: border-box; transform: rotate(6deg)"><div style="width: 100%; height: 100%; background: linear-gradient(160deg, #5E7A80, #D9CDB8)"></div></div>
      <div style="position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; color: #FFFFFF">Happy 25</div>

      <div style="position: absolute; left: 0; right: 0; top: 0; height: 68px; background: repeating-linear-gradient(135deg, rgba(242,139,130,0.30) 0 6px, rgba(242,139,130,0.10) 6px 12px); border-bottom: 1.5px dashed #F28B82; display: flex; align-items: center; justify-content: center">
        <span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: rgba(17,18,20,0.85); color: #F5B5AF">Covered by Instagram UI</span>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: repeating-linear-gradient(135deg, rgba(242,139,130,0.30) 0 6px, rgba(242,139,130,0.10) 6px 12px); border-top: 1.5px dashed #F28B82; display: flex; align-items: center; justify-content: center">
        <span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: rgba(17,18,20,0.85); color: #F5B5AF">Covered by reply bar</span>
      </div>
    </div>
  </div>

  <nav aria-label="Story frames" style="display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--divider)">
    <span style="font-size: 12px; color: var(--muted); margin-right: 4px">Frames</span>
    <button aria-label="Frame 1" style="width: 30px; height: 52px; border-radius: 6px; border: 2px solid #F2B84B; background: linear-gradient(180deg, #2F3B52, #6B5B8E 50%, #E3B48C); padding: 0"></button>
    <button aria-label="Frame 2" style="width: 30px; height: 52px; border-radius: 6px; border: 1px solid var(--border); background: linear-gradient(180deg, #8B6F9E, #E3B48C); padding: 0"></button>
    <button aria-label="Add frame" style="width: 30px; height: 52px; border-radius: 6px; border: 1px dashed var(--dash); background: transparent; color: var(--muted); font-size: 18px; padding: 0">+</button>
    <label style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted)">
      <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--accent-text); margin: 0">Safe zone
    </label>
  </nav>

  <nav aria-label="Tools" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 6px 4px 24px; background: var(--surface); border-top-left-radius: 18px; border-top-right-radius: 18px">
    <button style="height: 62px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18M10 10v11"/></svg>Layout</button>
    <button style="height: 62px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>Photos</button>
    <button style="height: 62px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
    <button style="height: 62px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="4"/><rect x="13" y="13" width="8" height="8" rx="1"/><path d="M4 21l4-6 4 6z"/></svg>Elements</button>
    <button style="height: 62px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/></svg>Filters</button>
    <button style="height: 62px; border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l6-6 12 12"/></svg>Background</button>
  </nav>
</div>
</body>
</html>
