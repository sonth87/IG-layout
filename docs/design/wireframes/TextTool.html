<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text tool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Be+Vietnam+Pro:wght@600&amp;family=Playfair+Display:wght@700&amp;family=Lora:wght@600&amp;family=Montserrat:wght@700&amp;family=Dancing+Script:wght@700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
a{color:var(--accent-text)}
.theme-dark{--bg:#111214;--canvas:#0B0B0C;--surface:#1C1D21;--surface2:#26282D;--border:#2E3036;--border2:#3A3C42;--divider:#1F2024;--text:#F2F2F0;--text2:#C4C6CC;--muted:#A3A6AD;--disabled:#55585F;--accent-text:#F2B84B;--accent-soft:#2A2312;--accent-soft-border:#5A4618;--accent-soft-text:#F5E6C4;--info-bg:#142430;--info-border:#23445A;--info-text:#CFE6F5;--info-strong:#7CC4F2;--story-bg:#2A1730;--story-text:#E59BF0;--danger:#F28B82;--ig-bg:#000000;--dash:#4A4D55}
.theme-light{--bg:#F6F5F2;--canvas:#E6E3DD;--surface:#FFFFFF;--surface2:#EFEDE8;--border:#DAD7D0;--border2:#C9C5BC;--divider:#E4E1DA;--text:#1A1B1E;--text2:#3D4047;--muted:#5F636B;--disabled:#B5B8BE;--accent-text:#8A5A00;--accent-soft:#FCEFD2;--accent-soft-border:#EED9A6;--accent-soft-text:#5C4310;--info-bg:#E3F1FA;--info-border:#B9DCF0;--info-text:#1F4F70;--info-strong:#0F5C8A;--story-bg:#F6E6F8;--story-text:#8A2E99;--danger:#C0392B;--ig-bg:#FFFFFF;--dash:#B8B3A9}
button{font-family:inherit}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="theme-dark" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: relative; flex: 1; background: var(--canvas); display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 272px; height: 340px; background: linear-gradient(180deg, #6E8FB3 0%, #9CB1C4 35%, #C9A27A 62%, #4A5634 100%)">
      <div style="position: absolute; left: 22px; right: 22px; top: 120px; padding: 8px 6px; border: 2px solid #F2B84B; text-align: center; font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; line-height: 1.15; color: #FFFFFF; text-shadow: 0 2px 8px rgba(0,0,0,0.35)">Đà Lạt<br>mùa sương</div>
      <div style="position: absolute; left: 16px; top: 114px; width: 12px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 2px solid #F2B84B"></div>
      <div style="position: absolute; right: 16px; top: 114px; width: 12px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 2px solid #F2B84B"></div>
      <div style="position: absolute; left: 16px; top: 214px; width: 12px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 2px solid #F2B84B"></div>
      <div style="position: absolute; right: 16px; top: 214px; width: 12px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 2px solid #F2B84B"></div>
    </div>
    <button style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      Edit text
    </button>
  </div>

  <section aria-label="Text" style="background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 8px 0 24px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <button aria-label="Cancel" style="width: 48px; height: 48px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div style="font-size: 15px; font-weight: 700">Text</div>
      <button aria-label="Apply" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: #F2B84B; color: #1A1408; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>

    <div role="tablist" aria-label="Text options" style="display: flex; gap: 22px; padding: 6px 20px 0; border-bottom: 1px solid var(--border)">
      <button role="tab" aria-selected="true" style="height: 40px; border: none; border-bottom: 2px solid #F2B84B; background: transparent; color: var(--text); font-size: 14px; font-weight: 700; padding: 0">Font</button>
      <button role="tab" aria-selected="false" style="height: 40px; border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 0">Style</button>
      <button role="tab" aria-selected="false" style="height: 40px; border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 0">Color</button>
      <button role="tab" aria-selected="false" style="height: 40px; border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 0">Effects</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 14px 16px 0">
      <button style="height: 64px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px">
        <span style="font-family: 'Be Vietnam Pro', sans-serif; font-size: 20px; font-weight: 600">Đà Lạt</span><span style="font-size: 11px; color: var(--muted)">Be Vietnam Pro</span>
      </button>
      <button aria-pressed="true" style="height: 64px; border-radius: 12px; border: 2px solid #F2B84B; background: var(--accent-soft); color: var(--text); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px">
        <span style="font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700">Đà Lạt</span><span style="font-size: 11px; color: var(--accent-text); font-weight: 600">Playfair Display</span>
      </button>
      <button style="height: 64px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px">
        <span style="font-family: 'Lora', serif; font-size: 20px; font-weight: 600">Đà Lạt</span><span style="font-size: 11px; color: var(--muted)">Lora</span>
      </button>
      <button style="height: 64px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px">
        <span style="font-family: 'Montserrat', sans-serif; font-size: 19px; font-weight: 700">Đà Lạt</span><span style="font-size: 11px; color: var(--muted)">Montserrat</span>
      </button>
      <button style="height: 64px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px">
        <span style="font-family: 'Dancing Script', cursive; font-size: 22px; font-weight: 700">Đà Lạt</span><span style="font-size: 11px; color: var(--muted)">Dancing Script</span>
      </button>
      <button style="height: 64px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Đà Lạt</span><span style="font-size: 11px; color: var(--muted)">Space Grotesk</span>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 0">
      <div role="group" aria-label="Alignment" style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface2)">
        <button aria-label="Align left" style="width: 40px; height: 36px; border: none; border-radius: 9px; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h14"/></svg></button>
        <button aria-label="Align center" aria-pressed="true" style="width: 40px; height: 36px; border: none; border-radius: 9px; background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M5 18h14"/></svg></button>
        <button aria-label="Align right" style="width: 40px; height: 36px; border: none; border-radius: 9px; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M10 12h10M6 18h14"/></svg></button>
      </div>
      <div style="flex: 1; display: flex; gap: 6px; justify-content: flex-end">
        <button aria-label="White" style="width: 32px; height: 32px; border-radius: 16px; border: 2px solid #F2B84B; background: #FFFFFF; padding: 0"></button>
        <button aria-label="Black" style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--border2); background: #111111; padding: 0"></button>
        <button aria-label="Cream" style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--border2); background: #F3E3C3; padding: 0"></button>
        <button aria-label="Rose" style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--border2); background: #D9728A; padding: 0"></button>
        <button aria-label="More colors" style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--border2); background: conic-gradient(#F28B82, #F2B84B, #9DBF8E, #7CC4F2, #8E8FC9, #F28B82); padding: 0"></button>
      </div>
    </div>
  </section>
</div>
</body>
</html>
