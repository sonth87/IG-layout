<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
a{color:var(--accent-text)}
.theme-dark{--bg:#111214;--canvas:#0B0B0C;--surface:#1C1D21;--surface2:#26282D;--border:#2E3036;--border2:#3A3C42;--divider:#1F2024;--text:#F2F2F0;--text2:#C4C6CC;--muted:#A3A6AD;--disabled:#55585F;--accent-text:#F2B84B;--accent-soft:#2A2312;--accent-soft-border:#5A4618;--accent-soft-text:#F5E6C4;--info-bg:#142430;--info-border:#23445A;--info-text:#CFE6F5;--info-strong:#7CC4F2;--story-bg:#2A1730;--story-text:#E59BF0;--danger:#F28B82;--ig-bg:#000000;--dash:#4A4D55}
.theme-light{--bg:#F6F5F2;--canvas:#E6E3DD;--surface:#FFFFFF;--surface2:#EFEDE8;--border:#DAD7D0;--border2:#C9C5BC;--divider:#E4E1DA;--text:#1A1B1E;--text2:#3D4047;--muted:#5F636B;--disabled:#B5B8BE;--accent-text:#8A5A00;--accent-soft:#FCEFD2;--accent-soft-border:#EED9A6;--accent-soft-text:#5C4310;--info-bg:#E3F1FA;--info-border:#B9DCF0;--info-text:#1F4F70;--info-strong:#0F5C8A;--story-bg:#F6E6F8;--story-text:#8A2E99;--danger:#C0392B;--ig-bg:#FFFFFF;--dash:#B8B3A9}
button{font-family:inherit}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="theme-dark" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 10px 8px 4px">
    <a href="Main.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Settings</h1>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 22px">

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px">Appearance</h2>
      <div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <button role="radio" aria-checked="true" style="border-radius: 14px; border: 2px solid #F2B84B; background: var(--accent-soft); color: var(--text); padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="width: 54px; height: 64px; border-radius: 8px; overflow: hidden; display: flex; border: 1px solid var(--border2)"><span style="flex: 1; background: #F6F5F2"></span><span style="flex: 1; background: #111214"></span></span>
          <span style="font-size: 13px; font-weight: 700">System</span>
        </button>
        <button role="radio" aria-checked="false" style="border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="width: 54px; height: 64px; border-radius: 8px; background: #F6F5F2; border: 1px solid var(--border2); box-sizing: border-box; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px"><span style="height: 6px; width: 70%; border-radius: 3px; background: #C9C5BC"></span><span style="height: 20px; border-radius: 4px; background: #FFFFFF"></span><span style="height: 6px; width: 50%; border-radius: 3px; background: #F2B84B"></span></span>
          <span style="font-size: 13px">Light</span>
        </button>
        <button role="radio" aria-checked="false" style="border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="width: 54px; height: 64px; border-radius: 8px; background: #111214; border: 1px solid var(--border2); box-sizing: border-box; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px"><span style="height: 6px; width: 70%; border-radius: 3px; background: #3A3C42"></span><span style="height: 20px; border-radius: 4px; background: #1C1D21"></span><span style="height: 6px; width: 50%; border-radius: 3px; background: #F2B84B"></span></span>
          <span style="font-size: 13px">Dark</span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px">Language</h2>
      <div role="radiogroup" aria-label="Language" style="display: flex; padding: 4px; border-radius: 12px; background: var(--surface)">
        <button role="radio" aria-checked="true" style="flex: 1; height: 40px; border: none; border-radius: 9px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 14px">English</button>
        <button role="radio" aria-checked="false" style="flex: 1; height: 40px; border: none; border-radius: 9px; background: transparent; color: var(--text); font-size: 14px">Tiếng Việt</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px">Storage</h2>
      <div style="border-radius: 14px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span>4 projects</span><span style="font-weight: 700">248 MB</span></div>
        <div style="height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden"><div style="width: 18%; height: 6px; background: #F2B84B"></div></div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          Persistent storage granted
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted)">Your photos and projects are stored only on this device. Nothing is uploaded.</p>
      </div>
      <button style="height: 48px; border-radius: 14px; border: 1px solid var(--border); background: transparent; color: var(--danger); font-weight: 600; font-size: 14px">Delete all projects…</button>
    </section>

    <section style="display: flex; flex-direction: column; border-radius: 14px; background: var(--surface); overflow: hidden">
      <a href="#credits" style="height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--divider); font-size: 14px">Credits &amp; licenses<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
      <a href="#about" style="height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; color: var(--text); text-decoration: none; font-size: 14px">About<span style="color: var(--muted); font-size: 13px">v0.1</span></a>
    </section>
  </div>
</div>
</body>
</html>
